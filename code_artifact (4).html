<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背の順整列アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .shadow-lg, .shadow-md, .shadow-sm {
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">
    <header class="bg-indigo-600 text-white shadow-md no-print mb-8">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i data-lucide="arrow-up-narrow-wide" class="w-8 h-8"></i>
                <div>
                    <h1 class="text-xl font-bold leading-tight">背の順並び替えアプリ</h1>
                    <p class="text-xs text-indigo-200">名簿の作成・CSV読み込みから並び替え列配置まで</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="loadSampleData()" class="px-3 py-1.5 bg-indigo-500 hover:bg-indigo-400 text-white text-sm rounded-lg flex items-center gap-1.5 transition">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> サンプルデータ投入
                </button>
                <button onclick="clearAllData()" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-400 text-white text-sm rounded-lg flex items-center gap-1.5 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> 全消去
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel: Form and Data Management -->
            <div class="lg:col-span-5 space-y-6 no-print">
                <!-- Data Input Card -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i> 生徒の追加・編集
                    </h2>
                    
                    <form id="student-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                        <input type="hidden" id="edit-id" value="">
                        
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">氏名</label>
                            <input type="text" id="input-name" required placeholder="例: 山田 太郎" 
                                class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">性別</label>
                                <select id="input-gender" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                    <option value="男">男子 ♂</option>
                                    <option value="女">女子 ♀</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">身長 (cm)</label>
                                <input type="number" id="input-height" step="0.1" min="50" max="250" required placeholder="135.5" 
                                    class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="submit-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition flex items-center justify-center gap-1.5 shadow-sm">
                                <i data-lucide="plus" class="w-4 h-4"></i> 追加する
                            </button>
                            <button type="button" id="cancel-btn" onclick="resetForm()" class="hidden px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-sm transition">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>

                <!-- CSV Upload & Download -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="file-spreadsheet" class="w-5 h-5 text-indigo-600"></i> CSVファイル連携
                    </h2>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 font-medium py-2.5 px-3 rounded-lg text-xs text-center transition flex items-center justify-center gap-1.5">
                            <i data-lucide="upload" class="w-4 h-4"></i> CSV読み込み
                            <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="importCSV(event)">
                        </label>
                        <button onclick="exportCSV()" class="bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-medium py-2.5 px-3 rounded-lg text-xs text-center transition flex items-center justify-center gap-1.5">
                            <i data-lucide="download" class="w-4 h-4"></i> CSV出力
                        </button>
                    </div>
                    <p class="text-xs text-slate-400">※CSV形式: 氏名,性別(男/女),身長(cm)</p>
                </div>

                <!-- Student Roster List -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i> 生徒名簿一覧
                        </h2>
                        <span id="student-count" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full">0名</span>
                    </div>

                    <div class="max-h-72 overflow-y-auto pr-1">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-500 sticky top-0 text-xs">
                                <tr>
                                    <th class="py-2 px-3 rounded-l-md">氏名</th>
                                    <th class="py-2 px-2">性別</th>
                                    <th class="py-2 px-2">身長</th>
                                    <th class="py-2 px-3 rounded-r-md text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="roster-table-body" class="divide-y divide-slate-100">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                        <div id="empty-roster-msg" class="py-8 text-center text-slate-400 text-xs">
                            登録された生徒がいません
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-7 space-y-6">
                <!-- Display Control Box -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 no-print">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i data-lucide="sliders" class="w-5 h-5 text-indigo-600"></i> 並び替え・整列設定
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Grouping mode -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">並びモード</label>
                            <select id="mode-select" onchange="renderArrangement()" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="mixed">男女混合 (背の低い順)</option>
                                <option value="separated">男女別 (男子列・女子列)</option>
                                <option value="male_only">男子のみ</option>
                                <option value="female_only">女子のみ</option>
                            </select>
                        </div>

                        <!-- Column Count -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">列数 (1〜4列)</label>
                            <div class="grid grid-cols-4 gap-2">
                                <button onclick="setCols(1)" id="col-btn-1" class="col-btn py-1.5 border border-slate-300 rounded-lg text-sm font-semibold hover:bg-indigo-50 transition">1列</button>
                                <button onclick="setCols(2)" id="col-btn-2" class="col-btn py-1.5 border border-slate-300 rounded-lg text-sm font-semibold hover:bg-indigo-50 transition">2列</button>
                                <button onclick="setCols(3)" id="col-btn-3" class="col-btn py-1.5 border border-slate-300 rounded-lg text-sm font-semibold hover:bg-indigo-50 transition">3列</button>
                                <button onclick="setCols(4)" id="col-btn-4" class="col-btn py-1.5 border border-slate-300 rounded-lg text-sm font-semibold hover:bg-indigo-50 transition">4列</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end mt-4 pt-4 border-t border-slate-100">
                        <button onclick="window.print()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-medium flex items-center gap-2 transition">
                            <i data-lucide="printer" class="w-4 h-4"></i> 印刷 / PDF保存
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <div class="flex flex-wrap justify-between items-center gap-2 mb-4 pb-4 border-b border-slate-100">
                        <div>
                            <span class="text-xs font-bold text-indigo-600 tracking-wider uppercase">ARRANGEMENT</span>
                            <h2 class="text-xl font-bold text-slate-900" id="arrangement-title">整列結果 (先頭 ➔ 後方)</h2>
                        </div>
                        <div class="flex items-center gap-3 text-xs text-slate-500">
                            <button onclick="sortByHeight()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-medium text-xs flex items-center gap-1 transition">
                                <i data-lucide="arrow-up-down" class="w-3.5 h-3.5"></i> 身長順に初期化
                            </button>
                            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 男子</span>
                            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-pink-500 inline-block"></span> 女子</span>
                        </div>
                    </div>

                    <!-- Hint message for users -->
                    <div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 flex items-center gap-2">
                        <i data-lucide="hand" class="w-4 h-4 text-amber-600 shrink-0"></i>
                        <span>カードを<strong>1回クリックして選択</strong>し、<strong>別のカードをクリック</strong>すると手動で位置を入れ替えできます。</span>
                    </div>

                    <!-- Visual Columns Container -->
                    <div id="arrangement-container" class="space-y-8">
                        <!-- Dynamic rendered columns -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // State Management
        let students = [];
        let colCount = 2; // Default 2 columns
        let selectedStudentId = null; // Currently selected student ID for manual swapping

        // Sample initial data
        const sampleStudents = [
            { id: 1, name: "佐藤 健", gender: "男", height: 122.5 },
            { id: 2, name: "鈴木 葵", gender: "女", height: 119.0 },
            { id: 3, name: "高橋 陸", gender: "男", height: 134.2 },
            { id: 4, name: "田中 結衣", gender: "女", height: 125.8 },
            { id: 5, name: "渡辺 翔", gender: "男", height: 118.4 },
            { id: 6, name: "伊藤 凛", gender: "女", height: 129.1 },
            { id: 7, name: "山本 蓮", gender: "男", height: 138.0 },
            { id: 8, name: "中村 陽菜", gender: "女", height: 121.3 }
        ];

        // On Load Initializer
        window.onload = function() {
            lucide.createIcons();
            setCols(2);
            loadSampleData();
        };

        function renderRoster() {
            const tbody = document.getElementById('roster-table-body');
            const emptyMsg = document.getElementById('empty-roster-msg');
            const countBadge = document.getElementById('student-count');
            
            tbody.innerHTML = '';
            countBadge.textContent = `${students.length}名`;

            if (students.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }
            emptyMsg.classList.add('hidden');

            students.forEach((s) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                
                const genderBadgeClass = s.gender === '男' 
                    ? 'bg-blue-50 text-blue-600 border-blue-200' 
                    : 'bg-pink-50 text-pink-600 border-pink-200';

                tr.innerHTML = `
                    <td class="py-2 px-3 font-medium text-slate-800">${escapeHtml(s.name)}</td>
                    <td class="py-2 px-2">
                        <span class="px-2 py-0.5 border text-xs font-semibold rounded-full ${genderBadgeClass}">
                            ${s.gender}
                        </span>
                    </td>
                    <td class="py-2 px-2 text-slate-600">${s.height.toFixed(1)} cm</td>
                    <td class="py-2 px-3 text-right space-x-1">
                        <button onclick="editStudent(${s.id})" class="text-slate-400 hover:text-indigo-600 p-1 rounded">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteStudent(${s.id})" class="text-slate-400 hover:text-rose-600 p-1 rounded">
                            <i data-lucide="trash" class="w-4 h-4"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            lucide.createIcons();
            renderArrangement();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('input-name').value.trim();
            const gender = document.getElementById('input-gender').value;
            const height = parseFloat(document.getElementById('input-height').value);

            if (!name || isNaN(height)) return;

            if (editId) {
                // Update
                const index = students.findIndex(s => s.id == editId);
                if (index !== -1) {
                    students[index] = { id: parseInt(editId), name, gender, height };
                }
            } else {
                // Insert
                const newId = Date.now();
                students.push({ id: newId, name, gender, height });
            }

            resetForm();
            renderRoster();
        }

        function editStudent(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;

            document.getElementById('edit-id').value = student.id;
            document.getElementById('input-name').value = student.name;
            document.getElementById('input-gender').value = student.gender;
            document.getElementById('input-height').value = student.height;

            document.getElementById('submit-btn').innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> 更新する`;
            document.getElementById('cancel-btn').classList.remove('hidden');
            lucide.createIcons();
        }

        function deleteStudent(id) {
            students = students.filter(s => s.id !== id);
            renderRoster();
        }

        function resetForm() {
            document.getElementById('student-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('submit-btn').innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i> 追加する`;
            document.getElementById('cancel-btn').classList.add('hidden');
            lucide.createIcons();
        }

        function loadSampleData() {
            students = JSON.parse(JSON.stringify(sampleStudents));
            sortByHeight();
        }

        function clearAllData() {
            students = [];
            selectedStudentId = null;
            renderRoster();
        }

        // Sort students list strictly by height (Ascending)
        function sortByHeight() {
            students.sort((a, b) => a.height - b.height);
            selectedStudentId = null;
            renderRoster();
        }

        // Handle card click for swapping two students
        function handleCardClick(id) {
            if (selectedStudentId === null) {
                // Select first student
                selectedStudentId = id;
            } else if (selectedStudentId === id) {
                // Deselect if clicked same card
                selectedStudentId = null;
            } else {
                // Swap position between selectedStudentId and clicked id
                const idx1 = students.findIndex(s => s.id === selectedStudentId);
                const idx2 = students.findIndex(s => s.id === id);

                if (idx1 !== -1 && idx2 !== -1) {
                    const temp = students[idx1];
                    students[idx1] = students[idx2];
                    students[idx2] = temp;
                }
                selectedStudentId = null;
            }
            renderArrangement();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                const imported = [];

                lines.forEach((line, idx) => {
                    const parts = line.split(',').map(p => p.trim());
                    if (parts.length >= 3) {
                        const name = parts[0];
                        const gender = parts[1] === '女' || parts[1] === '女性' ? '女' : '男';
                        const height = parseFloat(parts[2]);

                        if (name && !isNaN(height)) {
                            imported.push({
                                id: Date.now() + idx,
                                name,
                                gender,
                                height
                            });
                        }
                    }
                });

                if (imported.length > 0) {
                    students = [...students, ...imported];
                    renderRoster();
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function exportCSV() {
            if (students.length === 0) return;
            let csvContent = "data:text/csv;charset=utf-8,氏名,性別,身長\n";
            students.forEach(s => {
                csvContent += `${s.name},${s.gender},${s.height}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "生徒背の順名簿.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function setCols(n) {
            colCount = n;
            document.querySelectorAll('.col-btn').forEach((btn, idx) => {
                if (idx + 1 === n) {
                    btn.className = "col-btn py-1.5 border border-indigo-600 bg-indigo-600 text-white rounded-lg text-sm font-semibold shadow-sm transition";
                } else {
                    btn.className = "col-btn py-1.5 border border-slate-300 rounded-lg text-sm font-semibold hover:bg-indigo-50 text-slate-700 transition";
                }
            });
            renderArrangement();
        }

        function distributeToColumns(list, numCols) {
            // Respect current array order (supports manual swapping)
            const columns = Array.from({ length: numCols }, () => []);
            
            list.forEach((student, index) => {
                const colIdx = index % numCols;
                columns[colIdx].push({ ...student, rank: index + 1 });
            });

            return columns;
        }

        function renderArrangement() {
            const mode = document.getElementById('mode-select').value;
            const container = document.getElementById('arrangement-container');
            container.innerHTML = '';

            if (students.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i data-lucide="user-x" class="w-12 h-12 mx-auto mb-2 stroke-1"></i>
                        <p>名簿にデータが登録されていません</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            if (mode === 'mixed') {
                renderGroup("男女混合", students, colCount);
            } else if (mode === 'separated') {
                const males = students.filter(s => s.gender === '男');
                const females = students.filter(s => s.gender === '女');
                
                renderGroup("男子の列", males, colCount, "blue");
                renderGroup("女子の列", females, colCount, "pink");
            } else if (mode === 'male_only') {
                const males = students.filter(s => s.gender === '男');
                renderGroup("男子のみ", males, colCount, "blue");
            } else if (mode === 'female_only') {
                const females = students.filter(s => s.gender === '女');
                renderGroup("女子のみ", females, colCount, "pink");
            }

            lucide.createIcons();
        }

        function renderGroup(title, studentList, numCols, theme = null) {
            const container = document.getElementById('arrangement-container');
            
            const groupWrapper = document.createElement('div');
            groupWrapper.className = "space-y-4";

            // Group header
            const header = document.createElement('div');
            header.className = "flex items-center gap-2 font-bold text-slate-700 border-l-4 border-indigo-500 pl-2.5";
            header.innerHTML = `<span>${title}</span> <span class="text-xs font-normal text-slate-500">(${studentList.length}名)</span>`;
            groupWrapper.appendChild(header);

            if (studentList.length === 0) {
                const empty = document.createElement('p');
                empty.className = "text-xs text-slate-400 pl-4 py-2";
                empty.textContent = "対象の生徒がいません。";
                groupWrapper.appendChild(empty);
                container.appendChild(groupWrapper);
                return;
            }

            // Distribute students
            const columns = distributeToColumns(studentList, numCols);

            // Responsive grid setup
            const grid = document.createElement('div');
            grid.className = `grid gap-4 grid-cols-${numCols}`;

            columns.forEach((colStudents, colIdx) => {
                const colEl = document.createElement('div');
                colEl.className = "bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2.5";
                
                const colTitle = document.createElement('div');
                colTitle.className = "text-xs font-bold text-slate-400 text-center pb-1 border-b border-slate-200";
                colTitle.textContent = `${colIdx + 1}列目`;
                colEl.appendChild(colTitle);

                colStudents.forEach((s) => {
                    const isMale = s.gender === '男';
                    const isSelected = selectedStudentId === s.id;

                    let bgClass = isMale ? 'bg-blue-50/80 border-blue-200' : 'bg-pink-50/80 border-pink-200';
                    let selectStyle = 'hover:border-slate-400 cursor-pointer';

                    // Highlight style when card is selected
                    if (isSelected) {
                        bgClass = 'bg-amber-100/90 border-amber-400 ring-4 ring-amber-300 shadow-md scale-[1.02]';
                        selectStyle = 'cursor-pointer animate-pulse';
                    }

                    const iconColor = isMale ? 'text-blue-500' : 'text-pink-500';
                    const badgeBg = isSelected ? 'bg-amber-500' : (isMale ? 'bg-blue-500' : 'bg-pink-500');

                    const card = document.createElement('div');
                    card.onclick = () => handleCardClick(s.id);
                    card.className = `${bgClass} ${selectStyle} border rounded-lg p-2.5 shadow-sm flex items-center justify-between gap-2 transition min-h-[72px] relative select-none`;
                    
                    card.innerHTML = `
                        <div class="flex items-center gap-2.5 min-w-0 flex-1">
                            <div class="${badgeBg} text-white font-bold text-xs w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition-colors">
                                ${s.rank}
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="font-semibold text-slate-800 text-sm leading-snug truncate" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
                                <div class="text-xs text-slate-500 font-medium">${s.height.toFixed(1)} <span class="text-[10px]">cm</span></div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            ${isSelected ? '<span class="text-[10px] font-bold text-amber-700 bg-amber-200 px-1.5 py-0.5 rounded">選択中</span>' : ''}
                            <i data-lucide="${isMale ? 'user' : 'user-round'}" class="${iconColor} w-4 h-4"></i>
                        </div>
                    `;
                    colEl.appendChild(card);
                });

                grid.appendChild(colEl);
            });

            groupWrapper.appendChild(grid);
            container.appendChild(groupWrapper);
        }

        // Utility to escape HTML string
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
